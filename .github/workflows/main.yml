name: Loan Default ML Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: loan-default-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  validate-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar dataset crudo
        run: |
          test -f data/raw/02_loan_data.csv
          echo "Dataset crudo verificado correctamente."

      - name: Limpiar datos
        run: |
          python scriptLimpieza.py

      - name: Verificar dataset limpio
        run: |
          test -f data/processed/02_loan_data_clean.csv
          echo "El archivo limpio se generó correctamente."

      - name: Cargar datos en Supabase
        if: ${{ github.event_name != 'pull_request' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Secrets de Supabase no configurados; se omite la carga a Supabase."
            exit 0
          fi
          python script_subir_data.py --entrada data/processed/02_loan_data_clean.csv --tabla loan_data_test --batch 10

      - name: Entrenar y evaluar el modelo
        run: |
          python script_entrenamiento.py

      - name: Verificar artefactos generados
        run: |
          test -f docs/metricas_rendimiento.png
          test -f data/processed/03_model_predictions_and_metrics.csv
          echo "El entrenamiento generó los artefactos esperados."

      - name: Subir artefactos del entrenamiento
        uses: actions/upload-artifact@v4
        with:
          name: loan-default-artifacts-${{ github.run_number }}
          path: |
            docs/metricas_rendimiento.png
            data/processed/03_model_predictions_and_metrics.csv
          if-no-files-found: error
